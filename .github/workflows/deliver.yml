name: Varan mektupları bildir

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Varış e-postalarını gönder
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL ve CRON_SECRET henüz tanımlı değil, atlanıyor."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/deliver"
